services:
  - type: web
    name: rag-agent-api
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install uv && uv sync --frozen --no-dev

    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      -key:PRIMARY-MODEL
        value: gpt-4o-mini
      -key:FALLBACK-MODEL
        value:  gpt-4o-mini
      -key:OPENAI_API_KEY
        sync:False
      - key: PYTHON_VERSION
        value: "3.14.6"

      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      - key: RATE_LIMIT
        value: "20/minute"

      - key: CACHE_TTL_SECONDS
        value: "300"

      - key: MAX_RETRIES
        value: "3"

      -key:LANCHAIN_API_KEY
        sync:false
      -key:LANGCHAIN_TRACING_V2
        value:true
      -key:LANGCHAIN-Project
        value: rag-agent-api
      healthCheckPath: /health
      autoDeploy: true
        
      
